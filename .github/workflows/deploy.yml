
name: Deploy VenueOnMyPlate Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: venueonmyplate-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: /
          API_INTERNAL_URL: http://127.0.0.1:3101
          NEXT_PUBLIC_SITE_URL: https://dev.venueonmyplate.com
          CSP_UPGRADE_INSECURE_REQUESTS: "0"

  deploy:
    name: Deploy to Contabo
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.CONTABO_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.CONTABO_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || secrets.CONTABO_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.CONTABO_SSH_KEY || secrets.SSH_PRIVATE_KEY }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "$VPS_HOST" || {
            echo "::error::Missing VPS_HOST"
            exit 1
          }
          test -n "$VPS_USER" || {
            echo "::error::Missing VPS_USER"
            exit 1
          }
          test -n "$VPS_SSH_KEY" || {
            echo "::error::Missing VPS_SSH_KEY"
            exit 1
          }

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vomp_deploy
          chmod 600 ~/.ssh/vomp_deploy

          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

      - name: Deploy website
        run: |
          PORT="${VPS_PORT:-22}"

          ssh -i ~/.ssh/vomp_deploy \
            -p "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${VPS_USER}@${VPS_HOST}" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/opt/venue-on-my-plate/main-website"
          APP_NAME="VOMP-MAIN-NEW"

          cd "$APP_DIR"

          echo "Checking repository..."
          git status --short
          git pull --ff-only origin main

          echo "Installing dependencies..."
          npm ci

          echo "Building production website..."
          export NEXT_TELEMETRY_DISABLED=1
          export NEXT_PUBLIC_API_URL=/
          export API_INTERNAL_URL=http://127.0.0.1:3101
          export NEXT_PUBLIC_SITE_URL=https://dev.venueonmyplate.com
          export CSP_UPGRADE_INSECURE_REQUESTS=0

          npm run build

          echo "Restarting website process..."
          pm2 restart "$APP_NAME"

          echo "Checking local HTTP response..."
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3102/ -o /dev/null; then
              echo "Website health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed. Recent process logs:"
          pm2 logs "$APP_NAME" --lines 60 --nostream || true
          exit 1
          REMOTE
